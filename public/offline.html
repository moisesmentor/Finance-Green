<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sem Conexão • Green Finance Pro</title>
  <meta name="theme-color" content="#059669">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060606;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #0f1216;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #10b981 0%, #059669 40%, #047857 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(5, 150, 105, 0.35);
    }
    .wifi-off-icon {
      width: 36px;
      height: 36px;
      color: #ffffff;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #94a3b8;
    }
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 100px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34d399;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    button {
      margin-top: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      border: none;
      background: #059669;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
      background: #047857;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg class="wifi-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 8.5a10 10 0 0 1 12.8 1.4"></path>
        <path d="M5 12.5a6 6 0 0 1 8.8-1.2"></path>
        <path d="M10.8 16.5a2 2 0 0 1 2.4-.2"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <span class="security-badge">
      🛡️ Seus dados estão seguros
    </span>

    <h1>Sem conexão com a internet</h1>

    <p>
      Por segurança, seus dados financeiros confidenciais não ficam expostos offline. Conecte-se à internet para abrir seu painel e sincronizar lançamentos.
    </p>

    <button onclick="window.location.reload()">
      Tentar reconectar
    </button>
  </div>
</body>
</html>
