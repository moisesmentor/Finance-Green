    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "O Green Finance Pro pede a senha do meu banco?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. Hoje todo o controle de lançamentos e saldos bancários no Green Finance Pro é feito por você (manualmente ou importando arquivos OFX/CSV do seu extrato), sem nunca solicitar agência, conta ou senha bancária."
            }
          },
          {
            "@type": "Question",
            "name": "Como meus dados financeiros são protegidos e onde ficam salvos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sua conta utiliza autenticação criptografada pelo Google Firebase Authentication e banco de dados Cloud Firestore na nuvem, com regras de segurança estritas que isolam os documentos pelo seu identificador único (UID)."
            }
          },
          {
            "@type": "Question",
            "name": "Vocês vendem ou compartilham meus dados financeiros?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Jamais. Não vendemos seus dados pessoais ou financeiros e não exibimos anúncios dentro do aplicativo."
            }
          },
          {
            "@type": "Question",
            "name": "Como funciona nos planos pagos e como posso cancelar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Você pode cancelar sua assinatura a qualquer momento, sem multa ou fidelidade. Além disso, compras iniciais contam com a garantia legal de 7 dias de reembolso integral (art. 49 do CDC)."
            }
          }
        ]
      }
